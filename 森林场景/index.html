</head><body><div id="app"></div><div class="hud"><div class="top"><div class="brand"><span class="mark">◈</span><span><b>生命探索者</b><small>PREHISTORIC FOREST</small></span></div><div class="metrics"><span id="position">-24 · 19 m</span><span id="fps">-- FPS</span></div></div><div class="crosshair"></div><div class="bottom"><div class="toolbar"><select class="control" id="mode" aria-label="摄像机模式"><option value="walk">步行探索</option><option value="fly">自由飞行</option><option value="overview">高空俯瞰</option></select><select class="control" id="quality" aria-label="画质"><option value="high">高画质</option><option value="medium" selected>中画质</option><option value="low">低画质</option></select><label class="control">时间 <input id="time" type="range" min="0" max="100" value="45" aria-label="时间调整"></label><button class="control active" id="fog">雾气</button><button class="control" id="fullscreen">全屏</button></div><div class="hint">WASD 移动 · 鼠标观察/拖动 · Shift 加速 · Space 跳跃/上升<br>V 切换视角 · C / Ctrl 下降 · Esc 释放鼠标</div></div></div><section class="intro" id="intro"><div class="intro-inner"><div class="eyebrow">一场穿越时空的自然探索</div><h1>走进<br>史前森林</h1><p>沿着林间通道走向蜿蜒河流。穿过竹状古植物与古老树群，从河岸、山谷到山脊，在同一个世界里自由探索。</p><button id="start" class="start">开始探索　↗</button><div class="instructions">WASD 移动　/　鼠标观察或拖动　/　Shift 加速　/　Space 跳跃<br>下方可切换步行、自由飞行与高空俯瞰</div><div id="status" class="status">正在构建场景…</div></div></section><button id="relock" class="relock" hidden>点击继续探索</button></body></html>
